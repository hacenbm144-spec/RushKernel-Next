name: Build RushKernel-Next

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'RushKernel variant to build'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - westwood
          - bbr
          - network
          - full
      device:
        description: 'Target device'
        required: true
        default: 'b0s'
        type: choice
        options:
          - b0s
          - r0s
          - g0s
      with_ksu:
        description: 'Include KernelSU-Next'
        required: true
        default: true
        type: boolean

env:
  KERNEL_NAME: RushKernel-Next
  KERNEL_VERSION: v0.1
  KBUILD_BUILD_USER: rushkernel
  KBUILD_BUILD_HOST: github

jobs:
  build:
    name: ${{ github.event.inputs.device }}/${{ github.event.inputs.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout RushKernel-Next
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 make rsync xz-utils \
            zip zstd python3 python-is-python3 wget unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rushkernel-${{ github.event.inputs.device }}-${{ github.event.inputs.variant }}
          max-size: 5G

      - name: Download Clang toolchain (ZyC AOSP build)
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang

          echo "[+] Finding latest ZyC Clang release..."
          LATEST=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest \
                   | grep "browser_download_url.*tar.gz" \
                   | head -1 \
                   | cut -d'"' -f4)

          if [ -z "$LATEST" ]; then
            echo "[!] API returned no URL, using known-good fallback"
            LATEST="https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240414-release/Clang-19.0.0git-20240414.tar.gz"
          fi

          echo "[+] Downloading: $LATEST"
          wget -q --show-progress -O clang.tar.gz "$LATEST"

          echo "[+] Extracting..."
          tar xf clang.tar.gz
          rm clang.tar.gz
          ls -la

          # Find the bin directory
          if [ -f bin/clang ]; then
            CLANG_DIR="$PWD"
          else
            SUB=$(ls -d */ 2>/dev/null | head -1)
            if [ -n "$SUB" ] && [ -f "$SUB/bin/clang" ]; then
              CLANG_DIR="$PWD/${SUB%/}"
            else
              echo "❌ Can't find clang binary"
              find . -name clang -type f 2>/dev/null
              exit 1
            fi
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "[+] CLANG_DIR=$CLANG_DIR"
          "$CLANG_DIR/bin/clang" --version

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master anykernel3

      - name: Generate RushKernel config fragment
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FRAG="arch/arm64/configs/rushkernel-${VARIANT}.config"

          echo "Creating: $FRAG"

          case "$VARIANT" in
            vanilla)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: vanilla
          # No additions - sanity check build pipeline
          EOF
              ;;
            westwood)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Westwood TCP
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_DEFAULT_TCP_CONG="westwood"
          EOF
              ;;
            bbr)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: BBR + FQ
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            network)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Network stack
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            full)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: FULL
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_TCP_CONG_NV=y
          CONFIG_TCP_CONG_LP=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_FQ_PIE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          CONFIG_TCP_MD5SIG=y
          EOF
              ;;
            *)
              echo "❌ Unknown variant: $VARIANT"
              exit 1
              ;;
          esac

          cat >> "$FRAG" <<EOF

          CONFIG_LOCALVERSION="-RushKernel-${KERNEL_VERSION}-${VARIANT}"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF

          echo "=== Fragment ==="
          cat "$FRAG"

      - name: Merge configs (fragment style)
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64

          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu }}"

          FRAGS=(
            arch/arm64/configs/s5e9925_defconfig
            arch/arm64/configs/${DEVICE}.config
          )

          if [ "$KSU" = "true" ] && [ -f arch/arm64/configs/ksu.config ]; then
            FRAGS+=(arch/arm64/configs/ksu.config)
          fi

          FRAGS+=(arch/arm64/configs/rushkernel-${VARIANT}.config)

          echo "Fragments to merge:"
          printf '  %s\n' "${FRAGS[@]}"

          mkdir -p out
          bash scripts/kconfig/merge_config.sh -O out "${FRAGS[@]}"

          echo ""
          echo "=== Key resulting configs ==="
          grep -E "CONFIG_TCP_CONG_(BBR|WESTWOOD|CUBIC)|CONFIG_DEFAULT_TCP_CONG|CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_MODEL_" out/.config | head -20 || true

      - name: Build kernel
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=rushkernel
          export KBUILD_BUILD_HOST=github

          echo "=== Compiler ==="
          clang --version

          echo ""
          echo "=== Building (15-30 min)... ==="
          set +e
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image dtbs modules 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ Build failed (code $BUILD_RC)"
            echo "=== Last 80 lines ==="
            tail -80 build.log
            exit $BUILD_RC
          fi

          echo ""
          echo "=== Outputs ==="
          ls -la out/arch/arm64/boot/
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Image not produced"
            exit 1
          fi
          echo "✅ Image: $(stat -c%s out/arch/arm64/boot/Image) bytes"

      - name: Package as AnyKernel3 zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu == 'true' && 'KSU' || 'noKSU' }}"
          TS=$(date +%Y%m%d-%H%M%S)
          ZIP="${KERNEL_NAME}-${KERNEL_VERSION}_${DEVICE}_${VARIANT}_${KSU}_${TS}.zip"

          cp out/arch/arm64/boot/Image anykernel3/Image

          if ls out/arch/arm64/boot/dts/exynos/*.dtb >/dev/null 2>&1; then
            cat out/arch/arm64/boot/dts/exynos/*.dtb > anykernel3/dtb
          fi

          cd anykernel3
          sed -i "s|kernel.string=.*|kernel.string=${KERNEL_NAME}-${KERNEL_VERSION}-${VARIANT} by hacenbm144-spec|" anykernel.sh
          sed -i "s|device.name1=.*|device.name1=${DEVICE}|" anykernel.sh
          sed -i "s|device.name2=.*|device.name2=SM-S908B|" anykernel.sh
          sed -i "s|device.name3=.*|device.name3=SM-S906B|" anykernel.sh
          sed -i "s|device.name4=.*|device.name4=SM-S901B|" anykernel.sh

          zip -r9 "../${ZIP}" . -x ".git*" -x "README.md"
          cd ..

          md5sum "${ZIP}" | tee "${ZIP}.md5"
          ls -la "${ZIP}"
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.md5
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## ✅ Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Device:** ${{ github.event.inputs.device }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** ${{ github.event.inputs.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KSU:** ${{ github.event.inputs.with_ksu }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${ZIP_NAME}" >> $GITHUB_STEP_SUMMARY
