me: Build RushKernel-Next

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'RushKernel variant to build'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - westwood
          - bbr
          - network
          - full
      device:
        description: 'Target device'
        required: true
        default: 'b0s'
        type: choice
        options:
          - b0s
          - r0s
          - g0s
      with_ksu:
        description: 'Include KernelSU-Next'
        required: true
        default: true
        type: boolean

env:
  KERNEL_NAME: RushKernel-Next
  KERNEL_VERSION: v0.1
  KBUILD_BUILD_USER: rushkernel
  KBUILD_BUILD_HOST: github
  # Base release to inherit vendor_boot.img and dtbo.img from
  BASE_RELEASE_TAG: v1.6
  BASE_RELEASE_REPO: milxnaq/android_kernel_samsung_s5e9925

jobs:
  build:
    name: ${{ github.event.inputs.device }}/${{ github.event.inputs.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout RushKernel-Next
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 make rsync xz-utils \
            zip zstd python3 python-is-python3 wget unzip jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rushkernel-${{ github.event.inputs.device }}-${{ github.event.inputs.variant }}
          max-size: 5G

      - name: Download Clang toolchain (ZyC AOSP build)
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang

          LATEST=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest \
                   | grep "browser_download_url.*tar.gz" \
                   | head -1 \
                   | cut -d'"' -f4)

          if [ -z "$LATEST" ]; then
            LATEST="https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240414-release/Clang-19.0.0git-20240414.tar.gz"
          fi

          echo "[+] Downloading: $LATEST"
          wget -q --show-progress -O clang.tar.gz "$LATEST"

          tar xf clang.tar.gz
          rm clang.tar.gz

          if [ -f bin/clang ]; then
            CLANG_DIR="$PWD"
          else
            SUB=$(ls -d */ 2>/dev/null | head -1)
            CLANG_DIR="$PWD/${SUB%/}"
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          "$CLANG_DIR/bin/clang" --version

      - name: Generate RushKernel config fragment
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FRAG="arch/arm64/configs/rushkernel-${VARIANT}.config"

          case "$VARIANT" in
            vanilla)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: vanilla
          EOF
              ;;
            westwood)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Westwood TCP
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_DEFAULT_TCP_CONG="westwood"
          EOF
              ;;
            bbr)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: BBR + FQ
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            network)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Network stack
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            full)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: FULL
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_TCP_CONG_NV=y
          CONFIG_TCP_CONG_LP=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_FQ_PIE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          CONFIG_TCP_MD5SIG=y
          EOF
              ;;
          esac

          cat >> "$FRAG" <<EOF

          CONFIG_LOCALVERSION="-RushKernel-${KERNEL_VERSION}-${VARIANT}"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF

          echo "=== Fragment ==="
          cat "$FRAG"

      - name: Merge configs
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64

          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu }}"

          FRAGS=(
            arch/arm64/configs/s5e9925_defconfig
            arch/arm64/configs/${DEVICE}.config
          )

          if [ "$KSU" = "true" ] && [ -f arch/arm64/configs/ksu.config ]; then
            FRAGS+=(arch/arm64/configs/ksu.config)
          fi

          FRAGS+=(arch/arm64/configs/rushkernel-${VARIANT}.config)

          mkdir -p out
          bash scripts/kconfig/merge_config.sh -O out "${FRAGS[@]}"

      - name: Build kernel
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== Building kernel (15-30 min)... ==="
          set +e
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image dtbs modules 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ Build failed"
            tail -80 build.log
            exit $BUILD_RC
          fi

          ls -la out/arch/arm64/boot/
          [ -f out/arch/arm64/boot/Image ] || { echo "❌ Image missing"; exit 1; }
          echo "✅ Image: $(stat -c%s out/arch/arm64/boot/Image) bytes"

      # ============================================================
      # NEW: Download milxnaq's release for vendor_boot.img + dtbo.img
      # ============================================================
      - name: Download base release (milxnaq's v1.6) for vendor_boot + dtbo
        run: |
          mkdir -p base_release
          cd base_release

          DEVICE="${{ github.event.inputs.device }}"
          # Find the matching b0s KSU zip from milxnaq's release
          echo "[+] Fetching release info..."
          ASSETS=$(curl -s "https://api.github.com/repos/${BASE_RELEASE_REPO}/releases/tags/${BASE_RELEASE_TAG}" | jq -r '.assets[] | .browser_download_url')
          echo "Available assets:"
          echo "$ASSETS"

          # Pick the zip matching our device + KSU variant
          MATCH=$(echo "$ASSETS" | grep -i "_${DEVICE}_KSU_" | head -1)
          if [ -z "$MATCH" ]; then
            # Fallback to any device match
            MATCH=$(echo "$ASSETS" | grep -i "_${DEVICE}_" | head -1)
          fi

          if [ -z "$MATCH" ]; then
            echo "❌ No matching release zip found for device=${DEVICE}"
            exit 1
          fi

          echo "[+] Downloading: $MATCH"
          wget -q --show-progress -O base.zip "$MATCH"
          unzip -q base.zip
          ls -la files/

          # Verify we got what we need
          for img in vendor_boot.img dtbo.img; do
            if [ ! -f "files/$img" ]; then
              echo "❌ Missing $img in base release"
              exit 1
            fi
            echo "✅ Got files/$img ($(stat -c%s files/$img) bytes)"
          done

      # ============================================================
      # NEW: Build our own boot.img with the RushKernel-Next kernel
      # ============================================================
      - name: Build boot.img with our kernel
        run: |
          # Download magiskboot (easiest way to repack boot.img)
          mkdir -p tools
          cd tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.apk
          unzip -q -j magisk.apk "lib/arm64-v8a/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          cd ..

          # Use milxnaq's boot.img as template, swap kernel
          mkdir -p boot_work
          cp base_release/files/boot.img boot_work/
          cd boot_work

          echo "[+] Unpacking milxnaq's boot.img..."
          ../tools/magiskboot unpack boot.img

          echo "[+] Replacing kernel with our RushKernel build..."
          cp ../out/arch/arm64/boot/Image kernel

          echo "[+] Repacking boot.img..."
          ../tools/magiskboot repack boot.img new-boot.img

          ls -la new-boot.img
          cp new-boot.img ../boot.img
          cd ..

          echo "✅ boot.img repacked: $(stat -c%s boot.img) bytes"

      # ============================================================
      # NEW: Package the milxnaq-style flashable zip
      # ============================================================
      - name: Package milxnaq-style flashable zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu == 'true' && 'KSU' || 'noKSU' }}"
          TS=$(date +%Y%m%d-%H%M%S)
          ZIP="${KERNEL_NAME}-${KERNEL_VERSION}_${DEVICE}_${VARIANT}_${KSU}_${TS}.zip"

          mkdir -p package/files
          mkdir -p package/META-INF/com/google/android

          # Copy our boot.img and milxnaq's vendor_boot.img + dtbo.img
          cp boot.img package/files/boot.img
          cp base_release/files/vendor_boot.img package/files/vendor_boot.img
          cp base_release/files/dtbo.img package/files/dtbo.img

          # Use milxnaq's updater-script (same format he uses)
          cp build/updater-script package/META-INF/com/google/android/updater-script
          cp build/update-binary package/META-INF/com/google/android/update-binary
          chmod +x package/META-INF/com/google/android/update-binary

          # Verify
          ls -la package/files/
          ls -la package/META-INF/com/google/android/

          # Zip it
          cd package
          zip -r9 "../${ZIP}" .
          cd ..

          md5sum "${ZIP}" | tee "${ZIP}.md5"
          ls -la "${ZIP}"
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.md5
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## ✅ Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**3-img flashable zip in milxnaq style:**" >> $GITHUB_STEP_SUMMARY
          echo "- boot.img → RushKernel-Next built from source" >> $GITHUB_STEP_SUMMARY
          echo "- vendor_boot.img → inherited from milxnaq v1.6" >> $GITHUB_STEP_SUMMARY
          echo "- dtbo.img → inherited from milxnaq v1.6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Device:** ${{ github.event.inputs.device }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** ${{ github.event.inputs.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KSU:** ${{ github.event.inputs.with_ksu }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${ZIP_NAME}" >> $GITHUB_STEP_SUMMARY
