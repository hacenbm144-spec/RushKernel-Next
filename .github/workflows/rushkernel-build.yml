name: Build RushKernel-Next

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'RushKernel variant to build'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - westwood
          - bbr
          - network
          - full
      device:
        description: 'Target device'
        required: true
        default: 'b0s'
        type: choice
        options:
          - b0s
          - r0s
          - g0s
      with_ksu:
        description: 'Include KernelSU-Next'
        required: true
        default: true
        type: boolean

env:
  KERNEL_NAME: RushKernel-Next
  KERNEL_VERSION: v0.1
  KBUILD_BUILD_USER: rushkernel
  KBUILD_BUILD_HOST: github
  BASE_RELEASE_TAG: v1.6
  BASE_RELEASE_REPO: milxnaq/android_kernel_samsung_s5e9925

jobs:
  build:
    name: ${{ github.event.inputs.device }}/${{ github.event.inputs.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout RushKernel-Next
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 make rsync xz-utils \
            zip zstd python3 python3-pip python-is-python3 wget unzip jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu
          pip3 install lz4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rushkernel-${{ github.event.inputs.device }}-${{ github.event.inputs.variant }}
          max-size: 5G

      - name: Download Clang toolchain (ZyC AOSP build)
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang

          LATEST=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest \
                   | grep "browser_download_url.*tar.gz" \
                   | head -1 \
                   | cut -d'"' -f4)

          if [ -z "$LATEST" ]; then
            LATEST="https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240414-release/Clang-19.0.0git-20240414.tar.gz"
          fi

          echo "[+] Downloading: $LATEST"
          wget -q --show-progress -O clang.tar.gz "$LATEST"

          tar xf clang.tar.gz
          rm clang.tar.gz

          if [ -f bin/clang ]; then
            CLANG_DIR="$PWD"
          else
            SUB=$(ls -d */ 2>/dev/null | head -1)
            CLANG_DIR="$PWD/${SUB%/}"
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          "$CLANG_DIR/bin/clang" --version

      - name: Generate RushKernel config fragment
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FRAG="arch/arm64/configs/rushkernel-${VARIANT}.config"

          case "$VARIANT" in
            vanilla)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: vanilla
          EOF
              ;;
            westwood)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Westwood TCP
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_DEFAULT_TCP_CONG="westwood"
          EOF
              ;;
            bbr)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: BBR + FQ
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            network)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: Network stack
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
              ;;
            full)
              cat > "$FRAG" <<EOF
          # RushKernel-Next: FULL
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_HYBLA=y
          CONFIG_TCP_CONG_NV=y
          CONFIG_TCP_CONG_LP=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_FQ_PIE=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          CONFIG_TCP_MD5SIG=y
          EOF
              ;;
          esac

          cat >> "$FRAG" <<EOF

          CONFIG_LOCALVERSION="-RushKernel-${KERNEL_VERSION}-${VARIANT}"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF

          echo "=== Fragment ==="
          cat "$FRAG"

      - name: Merge configs
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64

          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu }}"

          FRAGS=(
            arch/arm64/configs/s5e9925_defconfig
            arch/arm64/configs/${DEVICE}.config
          )

          if [ "$KSU" = "true" ] && [ -f arch/arm64/configs/ksu.config ]; then
            FRAGS+=(arch/arm64/configs/ksu.config)
          fi

          FRAGS+=(arch/arm64/configs/rushkernel-${VARIANT}.config)

          mkdir -p out
          bash scripts/kconfig/merge_config.sh -O out "${FRAGS[@]}"

      - name: Build kernel + modules
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== Building kernel + 327 modules (15-30 min)... ==="
          set +e
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image dtbs modules 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ Build failed"
            tail -80 build.log
            exit $BUILD_RC
          fi

          ls -la out/arch/arm64/boot/
          [ -f out/arch/arm64/boot/Image ] || { echo "❌ Image missing"; exit 1; }
          echo "✅ Image: $(stat -c%s out/arch/arm64/boot/Image) bytes"

          lz4 -B6 --content-size -f -9 out/arch/arm64/boot/Image out/arch/arm64/boot/Image.lz4
          echo "✅ Image.lz4: $(stat -c%s out/arch/arm64/boot/Image.lz4) bytes"

      - name: Collect kernel modules
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64

          echo "=== Installing modules to staging dir ==="
          mkdir -p out/modules_staging
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            INSTALL_MOD_PATH="$PWD/out/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "=== Modules built ==="
          find out/modules_staging -name "*.ko" | wc -l
          find out/modules_staging -name "*.ko" | head -20

          mkdir -p modules_flat/lib/modules
          find out/modules_staging -name "*.ko" -exec cp {} modules_flat/lib/modules/ \;

          "$CLANG_DIR/bin/llvm-strip" --strip-debug modules_flat/lib/modules/*.ko 2>/dev/null || true

          echo "=== Final module count ==="
          ls modules_flat/lib/modules/*.ko | wc -l
          du -sh modules_flat/

          ls modules_flat/lib/modules/*.ko | xargs -n1 basename | sort > our_modules_list.txt
          echo "First 20 modules:"
          head -20 our_modules_list.txt

      - name: Download base release (milxnaq's v1.6)
        run: |
          mkdir -p base_release
          cd base_release

          DEVICE="${{ github.event.inputs.device }}"
          ASSETS=$(curl -s "https://api.github.com/repos/${BASE_RELEASE_REPO}/releases/tags/${BASE_RELEASE_TAG}" | jq -r '.assets[] | .browser_download_url')

          MATCH=$(echo "$ASSETS" | grep -i "_${DEVICE}_KSU_" | head -1)
          [ -z "$MATCH" ] && MATCH=$(echo "$ASSETS" | grep -i "_${DEVICE}_" | head -1)

          if [ -z "$MATCH" ]; then
            echo "❌ No matching release zip found for device=${DEVICE}"
            exit 1
          fi

          echo "[+] Downloading: $MATCH"
          wget -q --show-progress -O base.zip "$MATCH"
          unzip -q base.zip
          ls -la files/

          for img in boot.img vendor_boot.img dtbo.img; do
            [ -f "files/$img" ] || { echo "❌ Missing $img"; exit 1; }
          done

      - name: Build boot.img with our kernel
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

          mkdir -p boot_work
          cd boot_work
          cp ../base_release/files/boot.img .

          echo "[+] Unpacking milxnaq's boot.img..."
          python3 ../tools/mkbootimg/unpack_bootimg.py --boot_img boot.img --out unpacked --format mkbootimg > mkbootimg_args.txt
          cat mkbootimg_args.txt

          echo "[+] Replacing kernel with LZ4 RushKernel..."
          cp ../out/arch/arm64/boot/Image.lz4 unpacked/kernel

          ARGS=$(cat mkbootimg_args.txt)
          ARGS=$(echo "$ARGS" | sed "s|--kernel [^ ]*|--kernel unpacked/kernel|g")
          ARGS=$(echo "$ARGS" | sed "s|--ramdisk [^ ]*|--ramdisk unpacked/ramdisk|g")
          ARGS=$(echo "$ARGS" | sed "s|--dtb [^ ]*|--dtb unpacked/dtb|g" 2>/dev/null || true)

          python3 ../tools/mkbootimg/mkbootimg.py $ARGS --output new-boot.img

          cp new-boot.img ../boot.img
          cd ..
          echo "✅ boot.img: $(stat -c%s boot.img) bytes"

      - name: Build vendor_boot.img with our modules
        run: |
          mkdir -p vboot_work
          cd vboot_work
          cp ../base_release/files/vendor_boot.img .

          echo "[+] Unpacking milxnaq's vendor_boot.img..."
          python3 ../tools/mkbootimg/unpack_bootimg.py --boot_img vendor_boot.img --out unpacked --format mkbootimg > mkbootimg_args.txt
          cat mkbootimg_args.txt
          ls -la unpacked/

          echo "[+] Building new dlkm ramdisk from our modules..."
          cd ../modules_flat
          find . -print0 | sort -z | cpio --null -o -H newc > ../vboot_work/our_dlkm.cpio
          cd ../vboot_work

          echo "Our CPIO size: $(stat -c%s our_dlkm.cpio) bytes"

          python3 <<'PYEOF'
          import lz4.block, struct, os
          with open('our_dlkm.cpio', 'rb') as f:
              data = f.read()
          BLOCK_SIZE = 8 * 1024 * 1024
          out = open('our_dlkm.lz4', 'wb')
          out.write(b'\x02\x21\x4c\x18')
          pos = 0
          while pos < len(data):
              chunk = data[pos:pos+BLOCK_SIZE]
              compressed = lz4.block.compress(chunk, mode='high_compression', store_size=False)
              out.write(struct.pack('<I', len(compressed)))
              out.write(compressed)
              pos += BLOCK_SIZE
          out.close()
          print(f"Compressed: {os.path.getsize('our_dlkm.lz4')} bytes (was {len(data)})")
          PYEOF

          ls -la our_dlkm.lz4
          cp our_dlkm.lz4 unpacked/vendor_ramdisk01

          echo "[+] Repacking vendor_boot.img with Python (avoids shell arg parsing issues)..."
          python3 <<'PYEOF'
          import subprocess, sys, os

          mkbootimg = '../tools/mkbootimg/mkbootimg.py'

          args = [
              'python3', mkbootimg,
              '--header_version', '4',
              '--pagesize', '0x00001000',
              '--base', '0x00000000',
              '--kernel_offset', '0x10008000',
              '--ramdisk_offset', '0x14000000',
              '--tags_offset', '0x10000000',
              '--dtb_offset', '0x0000000011f00000',
              '--vendor_cmdline', 'bootconfig loop.max_part=7',
              '--board', 'SRPUH13B009',
              '--dtb', 'unpacked/dtb',
              '--vendor_bootconfig', 'unpacked/bootconfig',
              '--ramdisk_type', '1',
              '--ramdisk_name', '',
              '--vendor_ramdisk_fragment', 'unpacked/vendor_ramdisk00',
              '--ramdisk_type', '3',
              '--ramdisk_name', 'dlkm',
              '--vendor_ramdisk_fragment', 'unpacked/vendor_ramdisk01',
              '--vendor_boot', 'new-vendor_boot.img',
          ]
          print("Running:", ' '.join(repr(a) for a in args))
          result = subprocess.run(args, check=True)
          print("Done")
          PYEOF

          ls -la new-vendor_boot.img
          cp new-vendor_boot.img ../vendor_boot.img
          cd ..
          echo "✅ vendor_boot.img: $(stat -c%s vendor_boot.img) bytes"
          echo "📊 Original: $(stat -c%s base_release/files/vendor_boot.img) bytes"

      - name: Package milxnaq-style flashable zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          VARIANT="${{ github.event.inputs.variant }}"
          KSU="${{ github.event.inputs.with_ksu == 'true' && 'KSU' || 'noKSU' }}"
          TS=$(date +%Y%m%d-%H%M%S)
          ZIP="${KERNEL_NAME}-${KERNEL_VERSION}_${DEVICE}_${VARIANT}_${KSU}_${TS}.zip"

          mkdir -p package/files
          mkdir -p package/META-INF/com/google/android

          cp boot.img package/files/boot.img
          cp vendor_boot.img package/files/vendor_boot.img
          cp base_release/files/dtbo.img package/files/dtbo.img

          cp build/updater-script package/META-INF/com/google/android/updater-script
          cp build/update-binary package/META-INF/com/google/android/update-binary
          chmod +x package/META-INF/com/google/android/update-binary

          ls -la package/files/

          cd package
          zip -r9 "../${ZIP}" .
          cd ..

          md5sum "${ZIP}" | tee "${ZIP}.md5"
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.md5
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## ✅ Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full RushKernel build with OUR modules:**" >> $GITHUB_STEP_SUMMARY
          echo "- boot.img → kernel (LZ4)" >> $GITHUB_STEP_SUMMARY
          echo "- vendor_boot.img → OUR modules (327 .ko files)" >> $GITHUB_STEP_SUMMARY
          echo "- dtbo.img → inherited from milxnaq v1.6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${ZIP_NAME}" >> $GITHUB_STEP_SUMMARY